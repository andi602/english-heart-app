<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Hearts</title>
  <style>
    :root {
      --bg: #0f131a;
      --card: #181e29;
      --card-2: #202837;
      --text: #f3f6fb;
      --muted: #9aa6bc;
      --accent: #ff4d6d;
      --accent-soft: rgba(255, 77, 109, 0.16);
      --ok: #38d996;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 16px 48px;
    }

    .wrap {
      max-width: 680px;
      margin: 0 auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 14px;
    }

    .hearts-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hearts-count {
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
    }

    .hearts-label {
      font-size: 13px;
      color: var(--muted);
    }

    .status {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 18px;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.45;
    }

    .status.ok {
      color: var(--ok);
      border-color: rgba(56, 217, 150, 0.35);
      background: rgba(56, 217, 150, 0.08);
    }

    h2 {
      font-size: 17px;
      margin: 22px 0 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 12px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    .char-emoji {
      font-size: 32px;
    }

    .char-name {
      font-weight: 700;
      font-size: 15px;
    }

    .char-cost {
      font-size: 13px;
      color: var(--muted);
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 9px 12px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }

    button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    button.unlocked {
      background: rgba(56, 217, 150, 0.16);
      color: var(--ok);
    }

    button.secondary {
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .lessons-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .lesson-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    .badge {
      background: var(--accent-soft);
      color: var(--accent);
      padding: 3px 9px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 12px;
    }

    .tools {
      margin-top: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top-bar">
      <div class="hearts-box">
        <div style="font-size: 32px;">❤️</div>
        <div>
          <div class="hearts-count" id="heartsCount">0</div>
          <div class="hearts-label">доступно сердечек</div>
        </div>
      </div>
      <div style="text-align: right;">
        <div style="font-size: 13px; color: var(--muted);">Открыто персонажей</div>
        <div style="font-weight: 700; font-size: 16px;" id="unlockedCount">0 / 6</div>
      </div>
    </div>

    <div class="status" id="statusBox">
      Готово к работе. Завершай уроки на Genius Space и переноси ссылку с наградой на это устройство.
    </div>

    <h2>Персонажи</h2>
    <div class="grid" id="charactersGrid"></div>

    <h2>Засчитанные уроки</h2>
    <div class="lessons-list" id="lessonsList"></div>

    <div class="tools">
      <button class="secondary" id="exportBtn">Скопировать бэкап</button>
      <button class="secondary" id="importBtn">Вставить бэкап</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'english_hearts_v7';

    const CHARACTERS = [
      { id: 'scout', name: 'Разведчик', emoji: '🧭', cost: 2 },
      { id: 'scribe', name: 'Летописец', emoji: '📜', cost: 5 },
      { id: 'alchemist', name: 'Алхимик', emoji: '🧪', cost: 9 },
      { id: 'warden', name: 'Страж', emoji: '🛡️', cost: 14 },
      { id: 'oracle', name: 'Оракул', emoji: '🔮', cost: 20 },
      { id: 'archon', name: 'Архонт', emoji: '👑', cost: 28 }
    ];

    function defaultState() {
      return {
        hearts: 0,
        unlocked: [],
        completedLessons: {}
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaultState();
        const parsed = JSON.parse(raw);
        return {
          hearts: Number(parsed.hearts) || 0,
          unlocked: Array.isArray(parsed.unlocked) ? parsed.unlocked : [],
          completedLessons:
            parsed.completedLessons && typeof parsed.completedLessons === 'object'
              ? parsed.completedLessons
              : {}
        };
      } catch (_) {
        return defaultState();
      }
    }

    function saveState(state) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function consumeQueryReward(state) {
      const params = new URLSearchParams(window.location.search);
      const lesson = (params.get('gs_lesson') || '').trim();
      const rawHearts = Number(params.get('gs_hearts'));

      if (!lesson && !Number.isFinite(rawHearts)) {
        return null;
      }

      // Очищаем параметры из ссылки, чтобы при обновлении страницы награда не дублировалась
      const cleanUrl = `${window.location.origin}${window.location.pathname}${window.location.hash}`;
      window.history.replaceState({}, '', cleanUrl);

      if (!lesson || ![1, 2, 3, 5].includes(rawHearts)) {
        return { ok: false, message: 'Некорректные параметры награды в ссылке.' };
      }

      if (state.completedLessons[lesson]) {
        return {
          ok: false,
          message: `Урок «${lesson}» уже был засчитан ранее (${state.completedLessons[lesson]} ❤️).`
        };
      }

      state.hearts += rawHearts;
      state.completedLessons[lesson] = rawHearts;
      saveState(state);

      return {
        ok: true,
        message: `Засчитано +${rawHearts} ❤️ за урок «${lesson}»!`
      };
    }

    function render(state, rewardNotice) {
      document.getElementById('heartsCount').textContent = state.hearts;
      document.getElementById('unlockedCount').textContent = `${state.unlocked.length} / ${CHARACTERS.length}`;

      const statusBox = document.getElementById('statusBox');
      if (rewardNotice) {
        statusBox.textContent = rewardNotice.message;
        statusBox.className = rewardNotice.ok ? 'status ok' : 'status';
      }

      const grid = document.getElementById('charactersGrid');
      grid.innerHTML = '';

      CHARACTERS.forEach((char) => {
        const isUnlocked = state.unlocked.includes(char.id);
        const canAfford = state.hearts >= char.cost;

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div>
            <div class="char-emoji">${char.emoji}</div>
            <div class="char-name">${char.name}</div>
            <div class="char-cost">Стоимость: ${char.cost} ❤️</div>
          </div>
        `;

        const btn = document.createElement('button');
        if (isUnlocked) {
          btn.textContent = 'Открыт';
          btn.className = 'unlocked';
          btn.disabled = true;
        } else {
          btn.textContent = `Открыть за ${char.cost} ❤️`;
          btn.disabled = !canAfford;
          btn.addEventListener('click', () => {
            if (state.unlocked.includes(char.id) || state.hearts < char.cost) return;
            state.hearts -= char.cost;
            state.unlocked.push(char.id);
            saveState(state);
            render(state, { ok: true, message: `Открыт персонаж «${char.name}»!` });
          });
        }

        card.appendChild(btn);
        grid.appendChild(card);
      });

      const lessonsList = document.getElementById('lessonsList');
      const entries = Object.entries(state.completedLessons).reverse();
      lessonsList.innerHTML = '';

      if (entries.length === 0) {
        lessonsList.innerHTML = `<div class="lesson-item"><span style="color: var(--muted);">Пока нет засчитанных уроков</span></div>`;
      } else {
        entries.forEach(([lessonId, reward]) => {
          const row = document.createElement('div');
          row.className = 'lesson-item';
          row.innerHTML = `<span>${lessonId}</span><span class="badge">+${reward} ❤️</span>`;
          lessonsList.appendChild(row);
        });
      }
    }

    const appState = loadState();
    const notice = consumeQueryReward(appState);
    render(appState, notice);

    document.getElementById('exportBtn').addEventListener('click', () => {
      const dump = localStorage.getItem(STORAGE_KEY) || JSON.stringify(defaultState());
      navigator.clipboard?.writeText(dump).catch(() => {});
      prompt('Скопируй свой бэкап сохранения:', dump);
    });

    document.getElementById('importBtn').addEventListener('click', () => {
      const raw = prompt('Вставь сюда сохранённый JSON-бэкап:');
      if (!raw) return;
      try {
        const parsed = JSON.parse(raw);
        const next = {
          hearts: Number(parsed.hearts) || 0,
          unlocked: Array.isArray(parsed.unlocked) ? parsed.unlocked : [],
          completedLessons:
            parsed.completedLessons && typeof parsed.completedLessons === 'object'
              ? parsed.completedLessons
              : {}
        };
        saveState(next);
        render(next, { ok: true, message: 'Прогресс успешно восстановлен из бэкапа!' });
      } catch (_) {
        alert('Некорректный формат бэкапа.');
      }
    });
  </script>
</body>
</html>
